server.port=8080
spring.application.name=money-transfer-service
# Файл с данными карт (формат описан в README).
transfer.cards-file=classpath:cards.json
# Журнал переводов (дата, время, карты, сумма, комиссия, результат)
transfer.journal-file=logs/transfers.log
# Комиссия за перевод, % от суммы
transfer.commission-percent=1
# Код подтверждения операции (FRONT всегда отправляет 0000)
transfer.confirmation-code=0000
transfer.cors-allowed-origins=*
